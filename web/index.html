<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Klondike Solitaire game.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0175C2">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Klondike">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Klondike Solitaire</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    /* Stack the game above a fixed-height ad band so the ad never overlaps the UI. */
    body { display: flex; flex-direction: column; background: #000; }
    #flutter_host { flex: 1 1 auto; position: relative; overflow: hidden; }
    #ad_band {
      flex: 0 0 90px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
    }
    #ad_band .adsbygoogle { width: 100%; max-width: 728px; height: 100%; }
    /* Shorter band on small / mobile screens. */
    @media (max-width: 700px) { #ad_band { flex-basis: 60px; } }
  </style>
</head>
<body>
  <!-- Flutter renders into this host (see web/flutter_bootstrap.js); it fills the viewport minus the ad band. -->
  <div id="flutter_host"></div>

  <!-- Ad band: reserved space at the bottom, never overlapping the game.
       Collapsed automatically when the ad is unfilled or blocked. -->
  <div id="ad_band">
    <ins id="ad_unit" class="adsbygoogle"
         style="display:block;"
         data-ad-client="ca-pub-0528279497359926"
         data-ad-slot="9596550305"
         data-ad-format="horizontal"
         data-full-width-responsive="true"></ins>
  </div>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0528279497359926"
       crossorigin="anonymous"></script>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});

    // Hide the ad band unless the ad actually fills. AdSense sets
    // data-ad-status="filled"/"unfilled" on the <ins>; ad blockers set
    // nothing at all, which the timeout fallback also collapses.
    (function () {
      var band = document.getElementById('ad_band');
      var unit = document.getElementById('ad_unit');
      var settled = false;

      function collapse() {
        if (settled) return;
        settled = true;
        band.style.display = 'none';
      }
      function keep() {
        settled = true; // ad is showing; leave the band in place
      }
      function evaluate() {
        var status = unit.getAttribute('data-ad-status');
        if (status === 'filled') { keep(); return true; }
        if (status === 'unfilled') { collapse(); return true; }
        return false; // not resolved yet
      }

      if (!evaluate()) {
        var observer = new MutationObserver(function () {
          if (evaluate()) observer.disconnect();
        });
        observer.observe(unit, { attributes: true, attributeFilter: ['data-ad-status'] });

        // Fallback: if no "filled" status arrives (unfilled slow, or the
        // adsbygoogle script was blocked), collapse the band.
        setTimeout(function () {
          if (!settled && unit.getAttribute('data-ad-status') !== 'filled') {
            observer.disconnect();
            collapse();
          }
        }, 4000);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Gradle file-system watching: on Windows it keeps handles open on the
# build/intermediates dirs, causing "Unable to delete directory" failures on the
# next build's clean step.
org.gradle.vfs.watch=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Run the Kotlin compiler in-process instead of via a separate daemon: on
# Windows the Kotlin daemon can fail to release its own incremental-cache
# files before Gradle tries to close them, breaking release builds of
# plugins with Kotlin sources (e.g. shared_preferences_android).
kotlin.compiler.execution.strategy=in-process
# Disable Kotlin incremental compilation: the incremental cache close step
# is what's failing on Windows (see above); non-incremental compilation
# avoids that cache entirely.
kotlin.incremental=false
